<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Degen · 加密交易员</title>
  <!-- favicon 内联 SVG：跟着 index.html 走，少一个要上传的文件 —— 深底 + 三根迷你 K 线。
       ⚠️ 这里是 `data:` URI，颜色只能硬编码（不能走 CSS 变量）；几何与 render.js 的
          logoEl() / tools/make-icons.mjs 三处必须逐字一致。 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0f1a'/%3E%3Crect x='11' y='27' width='4' height='29' fill='%23ff5b6a'/%3E%3Crect x='6' y='34' width='14' height='15' rx='2' fill='%23ff5b6a'/%3E%3Crect x='30' y='14' width='4' height='32' fill='%2300d18f'/%3E%3Crect x='25' y='21' width='14' height='18' rx='2' fill='%2300d18f'/%3E%3Crect x='49' y='6' width='4' height='30' fill='%2300d18f'/%3E%3Crect x='44' y='10' width='14' height='19' rx='2' fill='%2300d18f'/%3E%3C/svg%3E" />
  <!-- PWA（2026-10-01）：manifest ＋ 主题色 ＋ iOS 的「添加到主屏幕」补充声明。
       iOS Safari 不读 manifest 里的 display / 图标，只认 apple-* 这几条 —— 两条路都要走。
       ⚠️ 文件名必须是 `.json`（2026-10-01 实测定案）：线上托管（icr3am.com）的 MIME 表里
          没有 `.webmanifest`，它把清单回成 `application/octet-stream`，再叠上同站那条
          `X-Content-Type-Options: nosniff` —— 浏览器据此**不把清单当清单**，
          `beforeinstallprompt` 也就永远不触发（这就是「安装应用点了没反应」的根因）。
          `.json` 在那边回的是 `application/json`，是浏览器认的标准 JSON 类型。 -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0d0f12" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- 安卓侧的同一件事（参考项目 `我创造的完美球员` 也有这条）：让部分国产内核 / 老 WebView
       按「独立应用」而不是「浏览器书签」来添加，装出来的图标才不会带上地址栏。 -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Degen" />
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <!-- 首屏遮罩（**静态** · 2026-10-05）—— 新文档的**第一帧**就是它，把上一局残留的画面盖住。
       ⚠️ 病根：`.boot` 原来只由 JS（`render.renderBoot`）创建 ⇒ 新文档在新 JS 跑起来之前
          `#app` 是空的（背景色），而 `location.reload()` 期间浏览器仍会重绘**旧文档**（上一局的
          canvas）⇒ 玩家看到「旧状态残留一小会，之后才出现遮罩」。把遮罩写成 HTML 静态节点后，
          新文档一提交就自带一层全屏遮罩；JS 起来后 `renderBoot` 复用同一个节点换文案，
          `hideBoot` 摘掉它（见 `main.js` 的 `boot()` / `render.js` 的 `renderBoot`）。
       ⚠️ 样式 `.boot` 已定义在 `style.css`（`position:fixed; inset:0; background:var(--bg)`），
          而 `<link rel="stylesheet">` 是渲染阻塞的 ⇒ 首次绘制时它一定已经就位，不会闪白。 -->
  <div class="boot" id="boot">正在加载…</div>
  <div id="app"></div>
  <!-- 弹窗层（#overlay）放在 #app 之外：主界面骨架只建一次，弹层是独立的一层，不被主结构改动波及。
       平时带 hidden（否则这层会盖住整屏、把所有点击都吃掉），由 render.pickExchange 摘掉。 -->
  <div id="overlay" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
